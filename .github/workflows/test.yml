name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The shipped tool imports nothing newer than node:fs, so megascope runs on old
        # Node and the suite proves it on the same versions it claims. Lowering the floor
        # here is a promise to users; raising it is a breaking change.
        node: ['20', '22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test

  manifests:
    runs-on: ubuntu-latest
    name: plugin manifests
    steps:
      - uses: actions/checkout@v5

      # Publishing is a push, so a manifest mistake reaches users directly. This is the
      # same validation Claude Code runs when it loads the marketplace.
      - name: Validate marketplace and plugin manifests
        run: |
          npx --yes @anthropic-ai/claude-code plugin validate .
          npx --yes @anthropic-ai/claude-code plugin validate ./skills/megascope
